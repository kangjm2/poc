# Serves the built SPA and gives /api the same shape it has in development.
#
# In development `vite preview` proxies /api to the backend (see vite.config.ts);
# in a container that job is nginx's. Keeping the proxy means the frontend still
# calls a relative /api (api/client.ts), so no build-time API URL exists to get
# wrong per environment.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed asset filenames make these immutable; index.html must not be cached or
    # a deploy keeps serving the previous bundle's script tags.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # The SPA owns its routes: anything that is not a real file is index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        # Docker's embedded DNS, re-resolved rather than pinned at config load, so a
        # recreated backend container (new IP) does not need nginx restarted too.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend "http://backend:8080";
        proxy_pass $backend$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CSV import accepts 512 MB (spring.servlet.multipart in application.yml) and
        # parsing one takes minutes, so nginx must outlast the backend's own limits.
        client_max_body_size 512m;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
